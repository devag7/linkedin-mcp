name: Native Windows privacy probe

on:
  pull_request:
    paths:
      - '.github/workflows/windows-privacy.yml'
      - 'scripts/verify-windows-acl*'
      - 'src/safety/budgets.ts'
      - 'src/safety/state-lock.ts'
      - 'src/safety/windows-private-state.ts'
      - 'src/safety/circuit-storage.ts'
      - 'src/browser/engine.ts'

permissions:
  contents: read

jobs:
  second-user-acl:
    name: second-user-acl (Node ${{ matrix.node-version }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Probe disposable native NTFS state as a distinct local user
        shell: powershell
        run: ./scripts/verify-windows-acl.ps1
