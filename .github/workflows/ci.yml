name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Source checks (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Keep Windows fixtures under the current user profile
        if: runner.os == 'Windows'
        run: node --import tsx scripts/prepare-windows-ci-temp.ts

      - name: Check generated metadata
        run: npm run metadata:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build output
        run: node dist/index.js --version

  package:
    name: Packed artifact (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Keep Windows fixtures under the current user profile
        if: runner.os == 'Windows'
        run: node --import tsx scripts/prepare-windows-ci-temp.ts
      - run: npm run build
      - name: Install packed package and verify offline CLI and MCP
        run: npm run verify:package

      - name: Verify published 3.0.0 installation and client exports offline
        run: node scripts/verify-published-first-use.mjs .published-first-use

      - name: Verify published 4.1.1 installation and client exports offline
        run: node scripts/verify-published-first-use.mjs --temporary 4.1.1

      - name: Verify the runner's preinstalled Chrome on Windows
        if: runner.os == 'Windows'
        run: node -e 'const fs=require("node:fs"),p=require("node:path");const roots=[process.env.PROGRAMFILES,process.env["PROGRAMFILES(X86)"]].filter(Boolean);if(!roots.some(r=>fs.existsSync(p.join(r,"Google","Chrome","Application","chrome.exe"))))process.exit(1)'
      - name: Verify the runner's preinstalled Chrome on Linux
        if: runner.os == 'Linux'
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Verify the runner's preinstalled Chrome on macOS
        if: runner.os == 'macOS'
        run: node -e 'require("node:fs").accessSync("/Applications/Google Chrome.app/Contents/MacOS/Google Chrome", require("node:fs").constants.X_OK)'
      - name: Verify actual Chrome launch, ownership and cleanup without LinkedIn
        run: npm run verify:browser

  claude-bundle:
    name: Claude bundle (${{ matrix.os }}, Node 22)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keep Windows bundle fixtures under the current user profile
        if: runner.os == 'Windows'
        run: node --import tsx scripts/prepare-windows-ci-temp.ts
      - name: Build, unpack and start pinned 4.1.1 Claude bundle offline
        run: npm run build:claude-mcpb
